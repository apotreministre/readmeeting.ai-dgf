<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentification Microsoft - ReadMeeting.ai</title>
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #94a3b8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #10b981;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .text {
        font-size: 13px;
        color: #e2e8f0;
      }
      .subtext {
        font-size: 11px;
        color: #64748b;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <div class="text">Finalisation de l'authentification Microsoft Entra ID...</div>
      <div class="subtext">Cette fenêtre va se fermer automatiquement.</div>
    </div>
    <script type="module">
      import { broadcastResponseToMainFrame } from '@azure/msal-browser/redirect-bridge';

      // Exécution officielle du pont de redirection MSAL Browser v5
      broadcastResponseToMainFrame().catch((error) => {
        console.error('[MSAL Redirect Bridge Error]', error);
      });
    </script>
  </body>
</html>
